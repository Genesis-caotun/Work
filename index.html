<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作申請與結案管理平台</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>
:root{--g:#0b5d46;--m:#e8f4ef;--i:#17211e;--u:#66736e;--l:#dbe4e0;--r:#b42318;--b:#f5f7f6;--a:#d97706}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}header{background:var(--g);color:#fff;padding:17px 20px;position:sticky;top:0;z-index:2}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px}main{max-width:1100px;margin:26px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--l);border-radius:17px;padding:20px;box-shadow:0 7px 24px #14342a0d}.login{max-width:520px;margin:70px auto;text-align:center;padding:40px}.sub{color:var(--u);line-height:1.65}.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:18px}.tab{background:#fff;border:1px solid var(--l);color:var(--u)}.tab.on{background:var(--g);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.case{position:relative}.case.unread{border:2px solid #ef9b25}.dot{width:10px;height:10px;border-radius:50%;background:#ef9b25;position:absolute;right:16px;top:16px}.case h3{margin:0 25px 7px 0}.meta{font-size:13px;color:var(--u);line-height:1.7}.status{display:inline-flex;padding:5px 10px;border-radius:99px;background:var(--m);color:var(--g);font-weight:700;font-size:12px;margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}.primary{background:var(--g);color:#fff}.ghost{background:var(--m);color:var(--g)}.warn{background:#fff4df;color:#9a5a00}.form{display:grid;grid-template-columns:1.4fr 1fr auto;gap:10px}input,select{width:100%;border:1px solid var(--l);border-radius:9px;padding:11px;font:inherit}.msg{min-height:22px;color:var(--g)}.error{color:var(--r)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0e1c17aa;display:grid;place-items:center;padding:18px;z-index:5}.modal .card{width:min(520px,100%)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--l);font-size:14px}.tablewrap{overflow:auto}.badge{padding:4px 8px;border-radius:99px;background:var(--m);color:var(--g);font-size:12px;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.brand{font-size:17px}}
</style></head><body><header><div class="head"><div class="brand">工作申請與結案管理平台</div><div id="who">尚未登入</div></div></header><main>
<section id="login" class="card login"><h1>Google 帳號登入</h1><p class="sub">工作申請、主管審核與結案資料集中管理。</p><div id="googleButton"></div><p id="loginMsg" class="msg"></p></section>
<section id="app" class="hidden"><div class="toolbar"><div><h1 style="margin:0">案件管理</h1><div id="summary" class="sub"></div></div><button class="ghost" onclick="logout()">登出</button></div><div class="tabs"><button class="tab on" onclick="showTab('cases',this)">案件列表</button><button id="newTab" class="tab" onclick="showTab('new',this)">建立申請</button><button id="adminTab" class="tab hidden" onclick="showTab('admin',this)">管理專區</button></div>
<section id="casesPanel"><div id="caseGrid" class="grid"></div></section>
<section id="newPanel" class="card hidden"><h2>建立工作申請</h2><form class="form" onsubmit="createCase(event)"><input id="title" placeholder="案件／活動名稱" required><input id="eventDate" type="date"><button class="primary">建立案件</button></form><p id="newMsg" class="msg"></p></section>
<section id="adminPanel" class="card hidden"><h2>白名單管理</h2><form class="form" style="grid-template-columns:1.3fr 1fr .8fr .8fr auto" onsubmit="saveUser(event)"><input id="email" type="email" placeholder="Google Email" required><input id="name" placeholder="姓名"><select id="role"><option value="staff">工作人員</option><option value="manager">主管</option><option value="admin">管理員</option></select><select id="status"><option value="active">啟用</option><option value="disabled">停用</option></select><button class="primary">儲存</button></form><p id="adminMsg" class="msg"></p><div class="tablewrap"><table><thead><tr><th>姓名</th><th>Email</th><th>權限</th><th>狀態</th><th></th></tr></thead><tbody id="userRows"></tbody></table></div></section></section></main>
<div id="uploadModal" class="modal hidden"><div class="card"><h2 id="uploadTitle">上傳檔案</h2><form id="uploadForm" method="post" target="uploadFrame"><input type="hidden" name="action" value="upload"><input type="hidden" name="idToken" id="uploadToken"><input type="hidden" name="caseId" id="uploadCase"><input type="hidden" name="fileType" id="uploadType"><input type="hidden" name="fileName" id="uploadName"><input type="hidden" name="mimeType" id="uploadMime"><input type="hidden" name="fileData" id="uploadData"><input id="filePicker" type="file" required><p class="sub">單一檔案上限 8MB</p><p id="uploadMsg" class="msg"></p><div class="actions"><button class="primary">上傳</button><button type="button" class="ghost" onclick="closeUpload()">取消</button></div></form><iframe name="uploadFrame" class="hidden"></iframe></div></div>
<script>
const CLIENT='512179941950-aagmp8o4h65jqp7q1c5390ad98029mcj.apps.googleusercontent.com',API='https://script.google.com/macros/s/AKfycbwODSs_JQczMsOH6KoFvSvzcCtb25LFA9iQ27ioymy54w5hiAuKyct3uyTzuxUyVnsfmg/exec';let token='',data={user:{},cases:[],users:[]};
window.onload=()=>{document.getElementById('uploadForm').action=API;google.accounts.id.initialize({client_id:CLIENT,callback:r=>{token=r.credential;load()}});google.accounts.id.renderButton(document.getElementById('googleButton'),{theme:'outline',size:'large',shape:'pill',text:'signin_with',locale:'zh_TW'})};
function api(action,p={}){return new Promise((ok,no)=>{const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),s=document.createElement('script');window[cb]=r=>{delete window[cb];s.remove();r.ok?ok(r):no(Error(r.error||'錯誤'))};s.onerror=()=>no(Error('無法連接後台'));s.src=API+'?'+new URLSearchParams({...p,action,idToken:token,callback:cb});document.body.appendChild(s)})}
async function load(){setMsg('loginMsg','正在登入…');try{data=await api('dashboard');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=(data.user.name||data.user.email)+'｜'+roleName(data.user.role);document.getElementById('adminTab').classList.toggle('hidden',data.user.role!=='admin');document.getElementById('newTab').classList.toggle('hidden',data.user.role==='manager');render()}catch(e){setMsg('loginMsg',e.message,true)}}
function render(){const unread=data.cases.filter(c=>data.user.role==='staff'?c.staffUnread:c.managerUnread).length;document.getElementById('summary').textContent=`共 ${data.cases.length} 件｜${unread} 件待處理`;document.getElementById('caseGrid').innerHTML=data.cases.length?data.cases.map(caseCard).join(''):'<div class="card sub">目前沒有案件。</div>';renderUsers()}
function caseCard(c){const unread=data.user.role==='staff'?c.staffUnread:c.managerUnread,files=[['申請書',c.application],['申請審核版',c.applicationReview],['結案報告',c.closure],['結案審核版',c.closureReview]].filter(x=>x[1]).map(x=>`<a class="btn ghost" target="_blank" href="${x[1]}">${x[0]}</a>`).join('');let up='';if((data.user.role==='staff'||data.user.role==='admin')&&c.status==='draft')up=uploadBtn(c,'application','上傳申請書');if((data.user.role==='manager'||data.user.role==='admin')&&c.status==='application_pending')up=uploadBtn(c,'application_review','上傳申請審核版');if((data.user.role==='staff'||data.user.role==='admin')&&c.status==='approved')up=uploadBtn(c,'closure','上傳結案報告');if((data.user.role==='manager'||data.user.role==='admin')&&c.status==='closure_pending')up=uploadBtn(c,'closure_review','上傳結案審核版');return`<article class="card case ${unread?'unread':''}" onclick="readCase('${c.id}')">${unread?'<span class="dot"></span>':''}<h3>${esc(c.title)}</h3><div class="meta">${c.id}｜申請人：${esc(c.applicantName||c.applicantEmail)}<br>活動日期：${esc(c.eventDate||'未填')}</div><div class="status">${statusName(c.status)}</div><div class="actions">${files}${up}</div></article>`}
function uploadBtn(c,t,label){return`<button class="primary" onclick="event.stopPropagation();openUpload('${c.id}','${t}','${label}')">${label}</button>`}
async function createCase(e){e.preventDefault();setMsg('newMsg','建立中…');try{data=await api('createCase',{title:v('title'),eventDate:v('eventDate')});e.target.reset();showTab('cases',document.querySelector('.tab'));render()}catch(x){setMsg('newMsg',x.message,true)}}
async function readCase(id){try{data=await api('markRead',{caseId:id});render()}catch(e){}}
function openUpload(id,t,label){document.getElementById('uploadModal').classList.remove('hidden');document.getElementById('uploadTitle').textContent=label;document.getElementById('uploadCase').value=id;document.getElementById('uploadType').value=t;document.getElementById('uploadToken').value=token}function closeUpload(){document.getElementById('uploadModal').classList.add('hidden');document.getElementById('uploadForm').reset();setMsg('uploadMsg','')}
document.getElementById('uploadForm').onsubmit=async e=>{e.preventDefault();const f=document.getElementById('filePicker').files[0];if(!f)return;if(f.size>8*1024*1024)return setMsg('uploadMsg','檔案不可超過8MB',true);setMsg('uploadMsg','正在上傳…');document.getElementById('uploadName').value=f.name;document.getElementById('uploadMime').value=f.type;document.getElementById('uploadData').value=await base64(f);e.target.submit()};
window.addEventListener('message',async e=>{if(e.origin!=='https://script.google.com'&&!e.origin.endsWith('-script.googleusercontent.com'))return;if(e.data&&e.data.ok){closeUpload();data=await api('dashboard');render()}else if(e.data)setMsg('uploadMsg',e.data.error||'上傳失敗',true)});
async function saveUser(e){e.preventDefault();try{data=await api('saveUser',{email:v('email'),name:v('name'),role:v('role'),status:v('status')});e.target.reset();render();setMsg('adminMsg','已更新')}catch(x){setMsg('adminMsg',x.message,true)}}
function renderUsers(){document.getElementById('userRows').innerHTML=(data.users||[]).map(u=>`<tr><td>${esc(u.name)||'—'}</td><td>${esc(u.email)}</td><td><span class="badge">${roleName(u.role)}</span></td><td>${u.status==='active'?'啟用':'停用'}</td><td><button class="ghost" onclick="editUser('${u.email}')">編輯</button></td></tr>`).join('')}
function editUser(e){const u=data.users.find(x=>x.email===e);['email','name','role','status'].forEach(k=>document.getElementById(k).value=u[k])}function showTab(n,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');['cases','new','admin'].forEach(x=>document.getElementById(x+'Panel').classList.toggle('hidden',x!==n))}function logout(){location.reload()}function v(i){return document.getElementById(i).value.trim()}function setMsg(i,m,e=false){const x=document.getElementById(i);x.textContent=m;x.className='msg'+(e?' error':'')}function base64(f){return new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)})}function roleName(r){return{staff:'工作人員',manager:'主管',admin:'管理員'}[r]||r}function statusName(s){return{draft:'待上傳申請書',application_pending:'申請待審核',approved:'執行中',closure_pending:'結案待審核',closed:'已結案'}[s]||s}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script></body></html>
