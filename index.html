<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作申請與結案管理平台</title><script src="https://accounts.google.com/gsi/client" async defer></script>
<style>:root{--g:#0b5d46;--m:#e8f4ef;--i:#17211e;--u:#66736e;--l:#dbe4e0;--r:#b42318;--b:#f5f7f6}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}header{background:var(--g);color:#fff;padding:18px 24px}.head{max-width:1080px;margin:auto;display:flex;justify-content:space-between}.brand{font-weight:800;font-size:20px}main{max-width:1080px;margin:32px auto;padding:0 20px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:24px;box-shadow:0 8px 30px #14342a0f}.login{max-width:520px;margin:70px auto;text-align:center;padding:42px}.login h1{margin:0 0 10px}.login p,.sub{color:var(--u);line-height:1.7}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.form{display:grid;grid-template-columns:1.3fr 1fr .8fr .8fr auto;gap:10px;margin:20px 0}input,select{border:1px solid var(--l);border-radius:10px;padding:11px 12px;font:inherit}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--g);color:#fff}.ghost{background:var(--m);color:var(--g)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--l);font-size:14px}th{color:var(--u);font-size:12px}.badge{padding:4px 9px;border-radius:99px;background:var(--m);color:var(--g);font-weight:700;font-size:12px}.off{background:#f1f3f2;color:#78817e}.msg{min-height:24px;color:var(--g)}.error{color:var(--r)}.hidden{display:none!important}.tablewrap{overflow:auto}@media(max-width:760px){.form{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.card{padding:18px}}</style></head>
<body><header><div class="head"><div class="brand">工作申請與結案管理平台</div><div id="who">尚未登入</div></div></header><main>
<section id="login" class="card login"><h1>Google 帳號登入</h1><p>僅限已加入白名單的工作人員與主管使用。<br>管理員登入後可維護帳號權限。</p><div id="googleButton"></div><p id="loginMsg" class="msg"></p></section>
<section id="admin" class="hidden"><div class="top"><div><h1>管理專區</h1><div class="sub">新增或停用可登入平台的 Google 帳號。</div></div><button class="ghost" onclick="logout()">登出</button></div><div class="card">
<form class="form" onsubmit="saveUser(event)"><input id="email" type="email" placeholder="Google Email" required><input id="name" placeholder="姓名"><select id="role"><option value="staff">工作人員</option><option value="manager">主管</option><option value="admin">管理員</option></select><select id="status"><option value="active">啟用</option><option value="disabled">停用</option></select><button class="primary">儲存帳號</button></form><div id="adminMsg" class="msg"></div><div class="tablewrap"><table><thead><tr><th>姓名</th><th>Email</th><th>權限</th><th>狀態</th><th>最後修改</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main>
<script>
const CLIENT_ID='512179941950-aagmp8o4h65jqp7q1c5390ad98029mcj.apps.googleusercontent.com';
const API='https://script.google.com/macros/s/AKfycbwODSs_JQczMsOH6KoFvSvzcCtb25LFA9iQ27ioymy54w5hiAuKyct3uyTzuxUyVnsfmg/exec';
let idToken='',users=[];
window.onload=()=>{google.accounts.id.initialize({client_id:CLIENT_ID,callback:r=>{idToken=r.credential;loadAdmin()}});google.accounts.id.renderButton(document.getElementById('googleButton'),{theme:'outline',size:'large',shape:'pill',text:'signin_with',locale:'zh_TW'})};
function api(action,params={}){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),s=document.createElement('script');window[cb]=r=>{delete window[cb];s.remove();r.ok?resolve(r):reject(new Error(r.error||'系統錯誤'))};s.onerror=()=>{delete window[cb];s.remove();reject(new Error('無法連接後台'))};s.src=API+'?'+new URLSearchParams({...params,action,idToken,callback:cb});document.body.appendChild(s)})}
async function loadAdmin(){setMsg('loginMsg','正在確認帳號…');try{const d=await api('getAdminData');users=d.users;document.getElementById('login').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');document.getElementById('who').textContent=(d.actor.name||d.actor.email)+'｜管理員';render()}catch(e){setMsg('loginMsg',e.message,true)}}
async function saveUser(e){e.preventDefault();setMsg('adminMsg','正在儲存…');try{const d=await api('saveUser',{email:v('email'),name:v('name'),role:v('role'),status:v('status')});users=d.users;render();e.target.reset();setMsg('adminMsg','已更新白名單')}catch(x){setMsg('adminMsg',x.message,true)}}
function render(){const L={staff:'工作人員',manager:'主管',admin:'管理員'};document.getElementById('rows').innerHTML=users.map(u=>`<tr><td>${esc(u.name)||'—'}</td><td>${esc(u.email)}</td><td><span class="badge">${L[u.role]}</span></td><td><span class="badge ${u.status==='active'?'':'off'}">${u.status==='active'?'啟用':'停用'}</span></td><td>${esc(u.updatedAt)}</td><td><button class="ghost" onclick="edit('${u.email}')">編輯</button></td></tr>`).join('')}
function edit(email){const u=users.find(x=>x.email===email);['email','name','role','status'].forEach(k=>document.getElementById(k).value=u[k]);scrollTo({top:0,behavior:'smooth'})}function logout(){idToken='';location.reload()}function v(i){return document.getElementById(i).value.trim()}function setMsg(i,m,e=false){const x=document.getElementById(i);x.textContent=m;x.className='msg'+(e?' error':'')}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script></body></html>
