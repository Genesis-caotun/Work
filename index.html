<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作申請與結案管理平台</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>
:root{--g:#0b5d46;--m:#e8f4ef;--i:#17211e;--u:#66736e;--l:#dbe4e0;--r:#b42318;--b:#f5f7f6;--a:#d97706}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}header{background:var(--g);color:#fff;padding:17px 20px;position:sticky;top:0;z-index:2}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:20px}.version{font-size:11px;opacity:.72;margin-left:7px}.userbox{text-align:right;font-size:13px}main{max-width:1100px;margin:26px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--l);border-radius:17px;padding:20px;box-shadow:0 7px 24px #14342a0d}.login{max-width:520px;margin:70px auto;text-align:center;padding:40px}.sub{color:var(--u);line-height:1.65}.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:18px}.tab{background:#fff;border:1px solid var(--l);color:var(--u)}.tab.on{background:var(--g);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.case{position:relative}.case.unread{border:2px solid #ef9b25}.dot{width:10px;height:10px;border-radius:50%;background:#ef9b25;position:absolute;right:16px;top:16px}.case h3{margin:0 25px 7px 0}.meta{font-size:13px;color:var(--u);line-height:1.7}.status{display:inline-flex;padding:5px 10px;border-radius:99px;background:var(--m);color:var(--g);font-weight:700;font-size:12px;margin:9px 0}.files{border-top:1px solid var(--l);margin-top:10px;padding-top:8px}.file-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-size:13px}.missing{color:#9aa39f}.download{padding:6px 10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--l)}button,.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}.primary{background:var(--g);color:#fff}.ghost{background:var(--m);color:var(--g)}.warn{background:#fff4df;color:#9a5a00}.danger{background:#fff0ef;color:var(--r);border:1px solid #f3c3bf}.admin-label{font-size:11px;font-weight:800;color:var(--r);width:100%;letter-spacing:.08em}.form{display:grid;grid-template-columns:1.4fr 1fr auto;gap:10px}input,select{width:100%;border:1px solid var(--l);border-radius:9px;padding:11px;font:inherit}.msg{min-height:22px;color:var(--g)}.error{color:var(--r)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0e1c17aa;display:grid;place-items:center;padding:18px;z-index:5}.modal .card{width:min(520px,100%)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--l);font-size:14px}.tablewrap{overflow:auto}.badge{padding:4px 8px;border-radius:99px;background:var(--m);color:var(--g);font-size:12px;font-weight:700}.loading{display:inline-flex;gap:8px;align-items:center}.spinner{width:16px;height:16px;border:2px solid #c8ddd5;border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.brand{font-size:16px}.userbox{font-size:11px}.file-row{align-items:flex-start}.toolbar-actions{width:100%}.toolbar-actions>*{flex:1;text-align:center}}
</style></head><body><header><div class="head"><div class="brand">工作申請與結案管理平台 <span class="version">v4.1</span></div><div id="who" class="userbox">尚未登入</div></div></header><main>
<section id="login" class="card login"><h1>Google 帳號登入</h1><p class="sub">工作申請、主管審核與結案資料集中管理。<br>登入後將在這台裝置保留30天。</p><div id="autoLogin" class="msg hidden"><span class="loading"><span class="spinner"></span>正在自動登入…</span></div><div id="googleButton"></div><p id="loginMsg" class="msg"></p></section>
<section id="app" class="hidden"><div class="toolbar"><div><h1 style="margin:0">案件管理</h1><div id="summary" class="sub"></div></div><div class="toolbar-actions"><a id="driveLink" class="btn ghost hidden" target="_blank" rel="noopener">開啟專用雲端資料夾</a><button class="ghost" onclick="logout()">登出</button></div></div><div class="tabs"><button class="tab on" onclick="showTab('cases',this)">案件列表</button><button id="newTab" class="tab" onclick="showTab('new',this)">建立申請</button><button id="adminTab" class="tab hidden" onclick="showTab('admin',this)">管理專區</button></div>
<section id="casesPanel"><div id="caseGrid" class="grid"></div></section>
<section id="newPanel" class="card hidden"><h2>建立工作申請</h2><form class="form" onsubmit="createCase(event)"><input id="title" placeholder="案件／活動名稱" required><input id="eventDate" type="date"><button class="primary">建立案件</button></form><p id="newMsg" class="msg"></p></section>
<section id="adminPanel" class="card hidden"><h2>白名單管理</h2><form class="form" style="grid-template-columns:1.3fr 1fr .8fr .8fr auto" onsubmit="saveUser(event)"><input id="email" type="email" placeholder="Google Email" required><input id="name" placeholder="姓名"><select id="role"><option value="staff">工作人員</option><option value="manager">主管</option><option value="admin">管理員</option></select><select id="status"><option value="active">啟用</option><option value="disabled">停用</option></select><button class="primary">儲存</button></form><p id="adminMsg" class="msg"></p><div class="tablewrap"><table><thead><tr><th>姓名</th><th>Email</th><th>權限</th><th>狀態</th><th></th></tr></thead><tbody id="userRows"></tbody></table></div></section></section></main>
<div id="uploadModal" class="modal hidden"><div class="card"><h2 id="uploadTitle">上傳檔案</h2><form id="uploadForm" method="post" target="uploadFrame"><input type="hidden" name="action" value="upload"><input type="hidden" name="authToken" id="uploadToken"><input type="hidden" name="caseId" id="uploadCase"><input type="hidden" name="fileType" id="uploadType"><input type="hidden" name="fileName" id="uploadName"><input type="hidden" name="mimeType" id="uploadMime"><input type="hidden" name="fileData" id="uploadData"><input id="filePicker" type="file" required><p class="sub">單一檔案上限 8MB；替換後舊檔會保留在Drive資料夾。</p><p id="uploadMsg" class="msg"></p><div class="actions"><button class="primary">上傳</button><button type="button" class="ghost" onclick="closeUpload()">取消</button></div></form><iframe name="uploadFrame" class="hidden"></iframe></div></div>
<div id="editModal" class="modal hidden"><div class="card"><h2>編輯案件</h2><form onsubmit="saveCaseEdit(event)"><input type="hidden" id="editCaseId"><p><input id="editTitle" placeholder="案件名稱" required></p><p><input id="editDate" type="date"></p><p id="editMsg" class="msg"></p><div class="actions"><button class="primary">儲存修改</button><button type="button" class="ghost" onclick="closeEdit()">取消</button></div></form></div></div>
<script>
const CLIENT='512179941950-aagmp8o4h65jqp7q1c5390ad98029mcj.apps.googleusercontent.com',API='https://script.google.com/macros/s/AKfycbwODSs_JQczMsOH6KoFvSvzcCtb25LFA9iQ27ioymy54w5hiAuKyct3uyTzuxUyVnsfmg/exec',FRONT_VERSION='4.1.0';let token=localStorage.getItem('workAuthToken')||'',data={user:{},cases:[],users:[]};
window.onload=()=>{document.getElementById('uploadForm').action=API;google.accounts.id.initialize({client_id:CLIENT,callback:googleLogin});google.accounts.id.renderButton(document.getElementById('googleButton'),{theme:'outline',size:'large',shape:'pill',text:'signin_with',locale:'zh_TW'});if(token){document.getElementById('googleButton').classList.add('hidden');document.getElementById('autoLogin').classList.remove('hidden');load(true)}};
async function googleLogin(r){setMsg('loginMsg','正在登入…');try{const x=await api('login',{idToken:r.credential});token=x.authToken;localStorage.setItem('workAuthToken',token);load()}catch(e){setMsg('loginMsg',e.message,true)}}
function api(action,p={}){return new Promise((ok,no)=>{const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),s=document.createElement('script');window[cb]=r=>{delete window[cb];s.remove();r.ok?ok(r):no(Error(r.error||'錯誤'))};s.onerror=()=>no(Error('無法連接後台'));s.src=API+'?'+new URLSearchParams({...p,action,authToken:token,callback:cb});document.body.appendChild(s)})}
async function load(auto=false){if(!auto)setMsg('loginMsg','正在登入…');try{data=await api('dashboard');document.getElementById('autoLogin').classList.add('hidden');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');const role=String(data.user.role||'').trim().toLowerCase();data.user.role=role;document.getElementById('who').textContent=(data.user.name||data.user.email)+'｜'+roleName(role);document.getElementById('adminTab').classList.toggle('hidden',role!=='admin');document.getElementById('newTab').classList.toggle('hidden',role==='manager');const drive=document.getElementById('driveLink');if(data.rootFolderUrl){drive.href=data.rootFolderUrl;drive.classList.remove('hidden')}render()}catch(e){if(auto||String(e.message).includes('登入')){localStorage.removeItem('workAuthToken');token='';document.getElementById('autoLogin').classList.add('hidden');document.getElementById('googleButton').classList.remove('hidden')}setMsg('loginMsg',e.message,true)}}
function render(){const unread=data.cases.filter(c=>data.user.role==='staff'?c.staffUnread:c.managerUnread).length;document.getElementById('summary').textContent=`共 ${data.cases.length} 件｜${unread} 件待處理`;document.getElementById('caseGrid').innerHTML=data.cases.length?data.cases.map(caseCard).join(''):'<div class="card sub">目前沒有案件。</div>';renderUsers()}
function caseCard(c){const isAdmin=data.user.role==='admin',isOwner=data.user.email===c.applicantEmail,unread=data.user.role==='staff'?c.staffUnread:c.managerUnread,files=[['申請書｜待審核版',c.application,'application',c.applicationUploader],['申請書｜主管核定版',c.applicationReview,'application_review',c.applicationReviewUploader],['結案報告｜待審核版',c.closure,'closure',c.closureUploader],['結案報告｜主管核定版',c.closureReview,'closure_review',c.closureReviewUploader]].map(x=>fileRow(c,...x)).join('');let up='';if((data.user.role==='staff'||isAdmin)&&c.status==='draft'&&(isOwner||isAdmin))up=uploadBtn(c,'application','上傳申請書');if((data.user.role==='manager'||isAdmin)&&c.status==='application_pending')up=uploadBtn(c,'application_review','上傳申請核定版');if((data.user.role==='staff'||isAdmin)&&c.status==='approved'&&(isOwner||isAdmin))up=uploadBtn(c,'closure','上傳結案報告');if((data.user.role==='manager'||isAdmin)&&c.status==='closure_pending')up=uploadBtn(c,'closure_review','上傳結案核定版');const adminLabel=isAdmin?'<div class="admin-label">管理員操作</div>':'',edit=(isAdmin||isOwner)?`<button class="ghost" onclick="event.stopPropagation();openEdit('${c.id}')">編輯案件</button>`:'',del=isAdmin?`<button class="danger" onclick="event.stopPropagation();deleteCase('${c.id}')">刪除案件</button>`:'';return`<article class="card case ${unread?'unread':''}" onclick="readCase('${c.id}')">${unread?'<span class="dot"></span>':''}<h3>${esc(c.title)}</h3><div class="meta">${c.id}｜申請人：${esc(c.applicantName||c.applicantEmail)}<br>活動日期：${esc(c.eventDate||'未填')}</div><div class="status">${statusName(c.status)}</div><div class="files">${files}</div><div class="actions">${adminLabel}${up}${edit}${del}</div></article>`}
function fileRow(c,label,url,type,uploader){if(!url)return`<div class="file-row"><span>${label}</span><span class="missing">尚未上傳</span></div>`;const replace=data.user.role==='admin'||data.user.email===uploader;return`<div class="file-row"><span>${label}</span><span><a class="btn ghost download" target="_blank" href="${url}" onclick="event.stopPropagation()">下載</a>${replace?` <button class="ghost download" onclick="event.stopPropagation();openUpload('${c.id}','${type}','替換${label}')">替換</button>`:''}</span></div>`}
function uploadBtn(c,t,label){return`<button class="primary" onclick="event.stopPropagation();openUpload('${c.id}','${t}','${label}')">${label}</button>`}
async function createCase(e){e.preventDefault();setMsg('newMsg','建立中…');try{data=await api('createCase',{title:v('title'),eventDate:v('eventDate')});e.target.reset();showTab('cases',document.querySelector('.tab'));render()}catch(x){setMsg('newMsg',x.message,true)}}
async function readCase(id){try{data=await api('markRead',{caseId:id});render()}catch(e){}}
function openUpload(id,t,label){document.getElementById('uploadModal').classList.remove('hidden');document.getElementById('uploadTitle').textContent=label;document.getElementById('uploadCase').value=id;document.getElementById('uploadType').value=t;document.getElementById('uploadToken').value=token}function closeUpload(){document.getElementById('uploadModal').classList.add('hidden');document.getElementById('uploadForm').reset();setMsg('uploadMsg','')}
function openEdit(id){const c=data.cases.find(x=>x.id===id);document.getElementById('editCaseId').value=id;document.getElementById('editTitle').value=c.title;document.getElementById('editDate').value=c.eventDate||'';document.getElementById('editModal').classList.remove('hidden')}function closeEdit(){document.getElementById('editModal').classList.add('hidden')}async function saveCaseEdit(e){e.preventDefault();try{data=await api('editCase',{caseId:v('editCaseId'),title:v('editTitle'),eventDate:v('editDate')});closeEdit();render()}catch(x){setMsg('editMsg',x.message,true)}}async function deleteCase(id){if(!confirm('確定刪除這個案件？案件資料夾會移至Google Drive垃圾桶。'))return;try{data=await api('deleteCase',{caseId:id});render()}catch(x){alert(x.message)}}
document.getElementById('uploadForm').onsubmit=async e=>{e.preventDefault();const f=document.getElementById('filePicker').files[0];if(!f)return;if(f.size>8*1024*1024)return setMsg('uploadMsg','檔案不可超過8MB',true);setMsg('uploadMsg','正在上傳…');document.getElementById('uploadName').value=f.name;document.getElementById('uploadMime').value=f.type;document.getElementById('uploadData').value=await base64(f);const id=document.getElementById('uploadCase').value,type=document.getElementById('uploadType').value;e.target.submit();pollUpload(id,type)};
async function pollUpload(id,type){const field={application:'application',application_review:'applicationReview',closure:'closure',closure_review:'closureReview'}[type];for(let i=0;i<15;i++){await new Promise(r=>setTimeout(r,2500));try{const d=await api('dashboard'),c=d.cases.find(x=>x.id===id);if(c&&c[field]){data=d;closeUpload();render();return}}catch(e){}}setMsg('uploadMsg','後台仍在處理，請重新整理頁面確認',true)}
window.addEventListener('message',async e=>{if(e.origin!=='https://script.google.com'&&!e.origin.endsWith('-script.googleusercontent.com'))return;if(e.data&&e.data.ok){closeUpload();data=await api('dashboard');render()}else if(e.data)setMsg('uploadMsg',e.data.error||'上傳失敗',true)});
async function saveUser(e){e.preventDefault();try{data=await api('saveUser',{email:v('email'),name:v('name'),role:v('role'),status:v('status')});e.target.reset();render();setMsg('adminMsg','已更新')}catch(x){setMsg('adminMsg',x.message,true)}}
function renderUsers(){document.getElementById('userRows').innerHTML=(data.users||[]).map(u=>`<tr><td>${esc(u.name)||'—'}</td><td>${esc(u.email)}</td><td><span class="badge">${roleName(u.role)}</span></td><td>${u.status==='active'?'啟用':'停用'}</td><td><button class="ghost" onclick="editUser('${u.email}')">編輯</button></td></tr>`).join('')}
function editUser(e){const u=data.users.find(x=>x.email===e);['email','name','role','status'].forEach(k=>document.getElementById(k).value=u[k])}function showTab(n,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');['cases','new','admin'].forEach(x=>document.getElementById(x+'Panel').classList.toggle('hidden',x!==n))}async function logout(){const old=token;localStorage.removeItem('workAuthToken');token='';try{token=old;await api('logout')}catch(e){}token='';location.reload()}function v(i){return document.getElementById(i).value.trim()}function setMsg(i,m,e=false){const x=document.getElementById(i);x.textContent=m;x.className='msg'+(e?' error':'')}function base64(f){return new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)})}function roleName(r){return{staff:'工作人員',manager:'主管',admin:'管理員'}[r]||r}function statusName(s){return{draft:'待上傳申請書',application_pending:'申請待審核',approved:'執行中',closure_pending:'結案待審核',closed:'已結案'}[s]||s}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script></body></html>
